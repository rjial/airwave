name: Release

# Push a semver tag to cut a release, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ------------------------------------------------------------ desktop server
  server-linux:
    name: Server (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (gpui + cpal/ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libasound2-dev \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libgl1-mesa-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/airwave "dist/airwave-${VERSION}-linux-x86_64"
          chmod +x "dist/airwave-${VERSION}-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: dist/*

  # ------------------------------------------------------------ android client
  client-android:
    name: Client (Android APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/airwave-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/airwave-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          suffix=""
          case "$apk" in *unsigned*) suffix="-unsigned";; esac
          cp "$apk" "dist/airwave-client-${VERSION}${suffix}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: android/dist/*

  # ------------------------------------------------------------------- release
  release:
    name: Publish GitHub Release
    needs: [server-linux, client-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generate_release_notes: true
          files: artifacts/**/*
