[package]
name = "airwave"
version = "0.1.0"
edition = "2021"
description = "Stream your computer's sound to other devices on your network, or play sound from them."

[[bin]]
name = "airwave"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
cpal = "0.16"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
nusb = "0.1"
futures-lite = "2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
